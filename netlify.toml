# Statische Seite ohne Build – Netlify veröffentlicht einfach den Ordner.
[build]
  publish = "."
  command = ""

# Seite, Skripte und Styles immer frisch abfragen (sonst laufen iPhones/Home-Bildschirm-Apps
# noch mit alten Versionen). Bilder dürfen weiter zwischengespeichert werden.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
